services:
  - type: web
    name: sunil-sir-classes-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: "https://sunil-sir-classes.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: sunil-classes-db
          property: connectionString

databases:
  - name: sunil-classes-db
    plan: free
    region: singapore
    databaseName: sunil_classes
    user: sunil_user
